[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2veg"
version = "0.1.0"
description = "Reproducible Sentinel-2 L2A vegetation monitoring: STAC discovery, cloud masking, spectral indices, temporal composites and validation."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.4",
    "pystac-client>=0.8",
    "pyproj>=3.6",
    "shapely>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "boto3>=1.34",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
s2veg = "s2veg.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
